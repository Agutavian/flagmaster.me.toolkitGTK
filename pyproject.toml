[project]
name = "flagmaster-toolkit"
version = "0.1.0"
description = "Flagmaster GTK toolkit"
requires-python = ">=3.11"
dependencies = [
    # "requests>=2.34,<3",
    "Pillow>=12.3.0",
]

[project.scripts]
flagmaster-toolkit = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools", "tools.*", "widgets", "widgets.*"]